[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-airlock"
version = "0.1.1"
description = "Declarative air-gapped software delivery — bundle OCI images, Helm charts, and manifests into one verifiable archive for disconnected clusters"
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["airgap", "kubernetes", "devsecops", "supply-chain", "cognis-digital", "cognis-neural-suite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/airlock"

[project.scripts]
"airlock-emit" = "airlock.connect:emit_main"
airlock = "airlock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["airlock"]
